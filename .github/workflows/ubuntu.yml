name: Ubuntu

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 实测 trusty 仍在官方主源 archive.ubuntu.com 上, 无需切换 old-releases
      - name: build ubuntu (Qt 5.2.1 in docker)
        run: >
          apt-get install -y build-essential ca-certificates \
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: bin/*
          if-no-files-found: error
