name: Ubuntu

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: build libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates unzip patch autoconf automake libtool
          bash ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: bin/*
          if-no-files-found: error
